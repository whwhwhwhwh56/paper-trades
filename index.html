<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serene Paper Book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F2F4F7;--surface:#FFFFFF;--surface2:#E9EDF2;--ink:#182A40;--ink2:#4C5E72;--ink3:#7E8DA0;
  --rule:#D3DBE4;--accent:#A9622C;--accent-soft:#F1E3D5;--navy:#1D3355;--on-navy:#FFFFFF;--link:#1D5A94;
  --good:#2E6B4E;--good-soft:#E2EFE8;--bad:#9C2F2F;--bad-soft:#F5E4E1;--warn:#8A6A1F;--warn-soft:#F6EEDA;
  --shadow:0 1px 2px rgba(24,42,64,.05),0 10px 30px -18px rgba(24,42,64,.25);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F151D;--surface:#161E28;--surface2:#1E2835;--ink:#DFE7F0;--ink2:#A4B2C2;--ink3:#77879A;
    --rule:#2A3849;--accent:#D08D4F;--accent-soft:#33251A;--navy:#9FB6D6;--on-navy:#0F151D;--link:#7FB2E5;
    --good:#6FBE94;--good-soft:#1C2F26;--bad:#E08A80;--bad-soft:#3A2220;--warn:#D9B35C;--warn-soft:#332B17;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F151D;--surface:#161E28;--surface2:#1E2835;--ink:#DFE7F0;--ink2:#A4B2C2;--ink3:#77879A;
  --rule:#2A3849;--accent:#D08D4F;--accent-soft:#33251A;--navy:#9FB6D6;--on-navy:#0F151D;--link:#7FB2E5;
  --good:#6FBE94;--good-soft:#1C2F26;--bad:#E08A80;--bad-soft:#3A2220;--warn:#D9B35C;--warn-soft:#332B17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:18px}h3{font-size:15px}
.wrap{max-width:1280px;margin:0 auto;padding:22px 24px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand small{color:var(--ink3);font-family:var(--serif);font-size:14px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:500;padding:7px 13px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.2}
button:hover{border-color:var(--ink3)}
button.primary{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
button.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
button.ghost{background:transparent}
button.small{padding:4px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.status{font-size:12px;color:var(--ink3);font-family:var(--mono)}
.status .live{color:var(--good)}.status .stale{color:var(--warn)}.status .err{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 22px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.tile .v{font-family:var(--serif);font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);margin-bottom:22px}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.card>.hd .sub{color:var(--ink3);font-size:12px}
.card>.bd{padding:14px 16px}
.tbl{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
th.sorted{color:var(--accent)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}
td.tk a{font-family:var(--mono);font-weight:500;color:var(--link)}
.pos{color:var(--good)}.neg{color:var(--bad)}.muted{color:var(--ink3)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--rule);color:var(--ink2);background:var(--surface2)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.rank{color:var(--ink3);font-family:var(--mono);font-size:12px}
.empty{padding:26px 16px;color:var(--ink3);text-align:center;font-family:var(--serif);font-size:15px}
form.inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--rule);border-radius:7px;background:var(--ground);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{min-height:220px;resize:vertical;font-family:var(--serif);font-size:15px;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.detail-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
@media (max-width:900px){.detail-grid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv .k{color:var(--ink3)}.kv .v{font-variant-numeric:tabular-nums}
.thesis{white-space:pre-wrap;font-family:var(--serif);font-size:15px;line-height:1.65}
.thesis:empty:before{content:"No thesis written yet.";color:var(--ink3)}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,24,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);max-width:440px;width:100%;padding:20px}
.modal h3{margin-bottom:8px}
.modal p{color:var(--ink2);font-size:13px;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:9px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);z-index:60;max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.crumb{color:var(--ink3);font-size:13px;margin-bottom:6px}
.big{font-family:var(--serif);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.valbar{margin:14px 0 6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.foot{color:var(--ink3);font-size:12px;margin-top:30px;border-top:1px solid var(--rule);padding-top:12px}
.hint{font-size:12px;color:var(--ink3)}
.danger{color:var(--bad)}
.nowrap{white-space:nowrap}
code{font-family:var(--mono);font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading the book…</div></div>

<script>
/* ============================================================
   Serene Paper Book — a single-file paper-trading ledger.
   Database of record: data/portfolio.json in this repository.
   Prices: CNBC quote service (CORS-open, keyless), fallback to
   data/prices.json refreshed by a GitHub Actions workflow.
   Editing: PIN-unlocked; the PIN decrypts a fine-grained GitHub
   token stored in data/vault.json, and edits are commits.
   ============================================================ */
const CONFIG = { owner: "", repo: "", branch: "main" };   // auto-detected on *.github.io when left blank

const S = {
  data: null, sha: null, prices: {}, snapshot: {}, snapshotAsof: null,
  refreshedAt: null, refreshing: false, token: null, vault: undefined,
  sort: { open: ["ret", -1], closed: ["ret", -1], watch: ["up", -1] },
  route: null, modal: null, toast: null, drafts: {}
};

/* ---------- repo detection ---------- */
function repoInfo() {
  if (CONFIG.owner && CONFIG.repo) return CONFIG;
  const h = location.hostname, p = location.pathname.split("/").filter(Boolean);
  if (h.endsWith(".github.io") && p.length) return { owner: h.split(".")[0], repo: p[0], branch: CONFIG.branch || "main" };
  return null;
}
const RI = repoInfo();
const apiBase = () => RI ? `https://api.github.com/repos/${RI.owner}/${RI.repo}/contents/` : null;
// Local mode: served by serve_local.py on this machine — edits write straight to disk, no PIN.
const LOCAL = (location.hostname === "127.0.0.1" || location.hostname === "localhost");

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const pd = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const num = v => (v === null || v === undefined || v === "" || isNaN(+v)) ? null : +v;
const fmtN = (v, d = 2) => v === null || v === undefined || isNaN(v) ? "—" : (+v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtP = (v, d = 1) => v === null || v === undefined || isNaN(v) ? "—" : (v > 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const fmtMoney = v => v === null || v === undefined || isNaN(v) ? "—" : (v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
const cls = v => v === null || v === undefined || isNaN(v) ? "muted" : v > 0 ? "pos" : v < 0 ? "neg" : "";
const uid = (p, list) => { let n = 1; const ids = new Set(list.map(x => x.id)); while (ids.has(`${p}-${String(n).padStart(4, "0")}`)) n++; return `${p}-${String(n).padStart(4, "0")}`; };
function toast(msg, err) { S.toast = { msg, err }; renderToast(); clearTimeout(S._tt); S._tt = setTimeout(() => { S.toast = null; renderToast(); }, err ? 6000 : 2800); }
function renderToast() { let t = $("#toast"); if (t) t.remove(); if (!S.toast) return; t = document.createElement("div"); t.id = "toast"; t.className = "toast" + (S.toast.err ? " err" : ""); t.textContent = S.toast.msg; document.body.appendChild(t); }

/* ---------- data loading ---------- */
function emptyBook() { return { version: 1, updated: null, trades: [], watchlist: [], theses: {}, valuations: {} }; }
async function loadBook() {
  if (LOCAL) { try { const r = await fetch("/api/book?t=" + Date.now(), { cache: "no-store" }); if (r.ok) { S.data = normalise(await r.json()); return; } } catch (e) { } }
  // With a token we read through the API (always fresh); otherwise the Pages copy (fresh within ~1 min of a commit).
  if (S.token && apiBase()) {
    try {
      const r = await fetch(apiBase() + "data/portfolio.json?ref=" + RI.branch, { headers: { Authorization: "Bearer " + S.token, Accept: "application/vnd.github+json" }, cache: "no-store" });
      if (r.ok) { const j = await r.json(); S.sha = j.sha; S.data = normalise(JSON.parse(b64dec(j.content))); return; }
    } catch (e) { console.warn("api load failed", e); }
  }
  try {
    const r = await fetch("data/portfolio.json?t=" + Date.now(), { cache: "no-store" });
    S.data = normalise(r.ok ? await r.json() : emptyBook());
  } catch (e) { S.data = emptyBook(); }
}
function normalise(d) { const b = emptyBook(); Object.assign(b, d || {}); b.trades ||= []; b.watchlist ||= []; b.theses ||= {}; b.valuations ||= {}; return b; }
async function loadSnapshot() {
  try { const r = await fetch("data/prices.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) { const j = await r.json(); S.snapshot = j.prices || {}; S.snapshotAsof = j.asof || null; } } catch (e) { }
}
async function loadVault() {
  try { const r = await fetch("data/vault.json?t=" + Date.now(), { cache: "no-store" }); S.vault = r.ok ? await r.json() : null; } catch (e) { S.vault = null; }
}
const b64dec = s => decodeURIComponent(Array.from(atob(s.replace(/\n/g, "")), c => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join(""));
const b64enc = s => btoa(Array.from(new TextEncoder().encode(s), b => String.fromCharCode(b)).join(""));

/* ---------- prices ---------- */
function allTickers() {
  const set = new Map();
  for (const t of S.data.trades) set.set(t.ticker, t.quote_symbol || t.ticker);
  for (const w of S.data.watchlist) set.set(w.ticker, w.quote_symbol || w.ticker);
  return set;
}
async function refreshPrices() {
  if (S.refreshing) return; S.refreshing = true; renderStatus();
  const map = allTickers(); const syms = [...new Set(map.values())];
  const got = {};
  for (let i = 0; i < syms.length; i += 25) {
    const chunk = syms.slice(i, i + 25);
    const u = "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=" + encodeURIComponent(chunk.join("|")) + "&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json";
    try {
      const j = await (await fetch(u, { cache: "no-store" })).json();
      for (const q of (j.FormattedQuoteResult?.FormattedQuote || [])) {
        const last = num(String(q.last || "").replace(/,/g, ""));
        if (q.code === 0 && last !== null) got[q.symbol] = { price: last, prev: num(String(q.previous_day_closing || "").replace(/,/g, "")), name: q.name, ccy: q.currencyCode, asof: q.last_time, mkt: q.curmktstatus, ext: q.ExtendedMktQuote ? num(String(q.ExtendedMktQuote.last || "").replace(/,/g, "")) : null, src: "live" };
      }
    } catch (e) { console.warn("cnbc", e); }
  }
  for (const [tk, sym] of map) {
    if (got[sym]) S.prices[tk] = got[sym];
    else if (S.snapshot[tk]) S.prices[tk] = { ...S.snapshot[tk], src: "snapshot", asof: S.snapshot[tk].asof || S.snapshotAsof };
    else if (!S.prices[tk]) S.prices[tk] = { price: null, src: "none" };
  }
  S.refreshedAt = new Date(); S.refreshing = false; render();
}
const px = tk => S.prices[tk]?.price ?? null;
/* Optional: ask the repository workflow to re-price the book through Massive now
   (the key lives in a repository secret, never in this page). Not wired to the
   refresh button — the workflow runs on its own at the 4 pm ET close; call
   dispatchSnapshot() from the console if an off-schedule Massive snapshot is wanted. */
async function dispatchSnapshot() {
  if (S.dispatching) return; S.dispatching = true;
  try {
    const r = await fetch(`https://api.github.com/repos/${RI.owner}/${RI.repo}/actions/workflows/prices.yml/dispatches`, { method: "POST", headers: { Authorization: "Bearer " + S.token, Accept: "application/vnd.github+json", "Content-Type": "application/json" }, body: JSON.stringify({ ref: RI.branch }) });
    if (!r.ok) { console.warn("dispatch refused", r.status); S.dispatching = false; return; }
    const before = S.snapshotAsof;
    for (let i = 0; i < 8; i++) {
      await new Promise(res => setTimeout(res, 20000));
      const j = await fetch(apiBase() + "data/prices.json?ref=" + RI.branch, { headers: { Authorization: "Bearer " + S.token, Accept: "application/vnd.github.raw+json" }, cache: "no-store" }).then(x => x.ok ? x.json() : null).catch(() => null);
      if (j && j.asof && j.asof !== before) {
        S.snapshot = j.prices || {}; S.snapshotAsof = j.asof;
        for (const [tk, q] of Object.entries(S.snapshot)) {
          const cur = S.prices[tk];
          if (q.provider === "massive" && !q.stale && q.price !== null && (!cur || cur.price === null || cur.src !== "live" || (q.asof && cur.asof && new Date(q.asof) >= new Date(cur.asof)))) S.prices[tk] = { ...q, src: "live", asof: q.asof };
        }
        S.refreshedAt = new Date(); render(); toast("Massive snapshot applied");
        break;
      }
    }
  } catch (e) { console.warn("dispatch", e); }
  S.dispatching = false;
}

/* ---------- metrics ---------- */
function tradeMetrics(t) {
  const sign = t.side === "SHORT" ? -1 : 1;
  const open = !t.exit_date;
  const p = open ? px(t.ticker) : num(t.exit_price);
  const endDate = open ? todayISO() : t.exit_date;
  const days = Math.max(0, daysBetween(t.entry_date, endDate));
  const entry = num(t.entry_price), qty = num(t.qty) || 0;
  let ret = null, irr = null, pnl = null, mv = null;
  if (p !== null && entry) {
    ret = sign * (p / entry - 1);
    pnl = sign * (p - entry) * qty;
    mv = p * qty;
    if (days >= 1 && 1 + ret > 0) irr = Math.pow(1 + ret, 365 / days) - 1;
  }
  return { open, p, days, ret, irr, pnl, mv, cost: entry * qty, sign };
}
function xirr(flows) { // flows: [{d: Date, a: number}]
  if (flows.length < 2) return null;
  const t0 = flows[0].d;
  const f = r => flows.reduce((s, x) => s + x.a / Math.pow(1 + r, (x.d - t0) / 31536e6), 0);
  let lo = -0.9999, hi = 10; let flo = f(lo), fhi = f(hi);
  if (isNaN(flo) || isNaN(fhi) || flo * fhi > 0) return null;
  for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2, fm = f(m); if (Math.abs(fm) < 1e-7) return m; if (flo * fm < 0) { hi = m; fhi = fm; } else { lo = m; flo = fm; } }
  return (lo + hi) / 2;
}
function bookSummary() {
  const rows = S.data.trades.map(t => ({ t, m: tradeMetrics(t) }));
  const open = rows.filter(r => r.m.open), closed = rows.filter(r => !r.m.open);
  const cost = open.reduce((s, r) => s + r.m.cost, 0);
  const mv = open.reduce((s, r) => s + (r.m.mv ?? r.m.cost), 0);
  const unreal = open.reduce((s, r) => s + (r.m.pnl ?? 0), 0);
  const real = closed.reduce((s, r) => s + (r.m.pnl ?? 0), 0);
  const flows = [];
  for (const r of rows) {
    flows.push({ d: pd(r.t.entry_date), a: -r.m.cost * r.m.sign });
    if (r.m.open) { if (r.m.mv !== null) flows.push({ d: pd(todayISO()), a: r.m.mv * r.m.sign }); }
    else flows.push({ d: pd(r.t.exit_date), a: num(r.t.exit_price) * num(r.t.qty) * r.m.sign });
  }
  flows.sort((a, b) => a.d - b.d);
  const irr = flows.length >= 2 && (flows[flows.length - 1].d - flows[0].d) >= 864e5 ? xirr(flows) : null;
  const priced = open.filter(r => r.m.p !== null).length;
  return { open: open.length, closed: closed.length, cost, mv, unreal, real, irr, priced, wins: closed.filter(r => r.m.pnl > 0).length };
}
function valuationFor(tk) { return S.data.valuations[tk] || null; }

/* ---------- persistence (commits) ---------- */
async function commitBook(mutate, message) {
  if (LOCAL) {
    const cur = await fetch("/api/book?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : emptyBook()).catch(() => emptyBook());
    const data = normalise(cur); if (mutate(data) === false) return false; data.updated = new Date().toISOString();
    const r = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) }).catch(() => null);
    if (r && r.ok) { S.data = data; toast("Saved locally — " + message); render(); refreshPrices(); return true; }
    toast("Local save failed — is serve_local.py running?", true); return false;
  }
  if (!S.token) { openUnlock(() => commitBook(mutate, message)); return false; }
  if (!apiBase()) { toast("No repository configured; cannot save.", true); return false; }
  for (let attempt = 0; attempt < 2; attempt++) {
    // re-read the latest so two editors don't clobber each other
    const cur = await fetch(apiBase() + "data/portfolio.json?ref=" + RI.branch, { headers: { Authorization: "Bearer " + S.token, Accept: "application/vnd.github+json" }, cache: "no-store" });
    let sha = null, data = emptyBook();
    if (cur.ok) { const j = await cur.json(); sha = j.sha; data = normalise(JSON.parse(b64dec(j.content))); }
    else if (cur.status !== 404) { toast("GitHub read failed: " + cur.status, true); return false; }
    const res = mutate(data);
    if (res === false) return false;
    data.updated = new Date().toISOString();
    const body = { message: message + " [via Paper Book]", content: b64enc(JSON.stringify(data, null, 2) + "\n"), branch: RI.branch };
    if (sha) body.sha = sha;
    const r = await fetch(apiBase() + "data/portfolio.json", { method: "PUT", headers: { Authorization: "Bearer " + S.token, Accept: "application/vnd.github+json", "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.ok) { const j = await r.json(); S.sha = j.content.sha; S.data = data; toast("Saved — " + message); render(); refreshPrices(); return true; }
    if (r.status === 409 && attempt === 0) continue;
    const err = await r.json().catch(() => ({}));
    toast("Save failed (" + r.status + "): " + (err.message || ""), true);
    if (r.status === 401) { S.token = null; sessionStorage.removeItem("pb_token"); render(); }
    return false;
  }
}

/* ---------- vault (PIN → token) ---------- */
async function deriveKey(pin, saltB64, iter) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: Uint8Array.from(atob(saltB64), c => c.charCodeAt(0)), iterations: iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
const rndB64 = n => btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(n))));
async function encryptToken(pin, token) {
  const salt = rndB64(16), iv = rndB64(12), iter = 310000;
  const key = await deriveKey(pin, salt, iter);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: Uint8Array.from(atob(iv), c => c.charCodeAt(0)) }, key, new TextEncoder().encode(token));
  return { v: 1, kdf: "PBKDF2-SHA256", iter, salt, iv, ct: btoa(String.fromCharCode(...new Uint8Array(ct))), created: new Date().toISOString() };
}
async function decryptToken(pin, vault) {
  const key = await deriveKey(pin, vault.salt, vault.iter);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: Uint8Array.from(atob(vault.iv), c => c.charCodeAt(0)) }, key, Uint8Array.from(atob(vault.ct), c => c.charCodeAt(0)));
  return new TextDecoder().decode(pt);
}
async function verifyToken(token) {
  const r = await fetch(`https://api.github.com/repos/${RI.owner}/${RI.repo}`, { headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" } });
  if (!r.ok) return "Token rejected by GitHub (" + r.status + ")";
  const j = await r.json(); if (!j.permissions || !j.permissions.push) return "Token has no write access to " + RI.owner + "/" + RI.repo;
  return null;
}

  const ed = !!S.token;
  const openT = openRows.length ? `<div class="tbl"><table><thead><tr><th class="l">#</th>${th("open", "ticker", "Ticker", "l")}${th("open", "entry_date", "Entered", "l")}<th>Side · qty</th>${th("open", "entry", "Entry")}${th("open", "p", "Price")}${th("open", "ret", "Return")}${th("open", "irr", "IRR p.a.")}${th("open", "pnl", "P&amp;L")}${th("open", "days", "Days")}${th("open", "base", "Intrinsic")}${th("open", "up", "Upside")}${ed ? "<th></th>" : ""}</tr></thead><tbody>` +
    sortRows(openRows, ok, od).map((r, i) => `<tr><td class="rank">${i + 1}</td><td class="tk l"><a href="#/t/${r.ticker}">${r.ticker}</a></td><td class="l">${r.entry_date}</td><td><span class="pill ${r.t.side === "SHORT" ? "warn" : ""}">${r.t.side}</span> ${fmtN(r.t.qty, 0)}</td><td>${fmtN(r.entry)}</td><td>${priceCell(r.ticker)}</td><td class="${cls(r.ret)}">${fmtP(r.ret)}</td><td class="${cls(r.irr)}" title="${r.days < 30 ? "annualised from under 30 days — treat with caution" : ""}">${fmtP(r.irr)}${r.days < 30 && r.irr !== null ? "<sup>†</sup>" : ""}</td><td class="${cls(r.pnl)}">${fmtMoney(r.pnl)}</td><td>${r.days}</td><td>${r.base !== null ? fmtN(r.base) : '<span class="muted">—</span>'}</td><td class="${cls(r.up)}">${fmtP(r.up)}</td>${ed ? `<td class="nowrap"><button class="small" onclick="exitTradeForm('${r.t.id}')">Exit</button> <button class="small ghost" onclick="deleteTrade('${r.t.id}')" title="delete">✕</button></td>` : ""}</tr>`).join("") + `</tbody></table></div><div class="hint" style="padding:8px 16px">† annualised from a holding period under 30 days. Intrinsic = base-case owner-earnings value per share; upside = intrinsic ÷ price − 1.</div>` : `<div class="empty">No open positions. ${ed ? 'Use <b>+ Trade</b> to enter one.' : 'Unlock editing to enter one.'}</div>`;
  const closedT = closedRows.length ? `<div class="tbl"><table><thead><tr><th class="l">#</th>${th("closed", "ticker", "Ticker", "l")}${th("closed", "entry_date", "Entered", "l")}${th("closed", "exit_date", "Exited", "l")}<th>Side · qty</th>${th("closed", "entry", "Entry")}${th("closed", "exit", "Exit")}${th("closed", "ret", "Return")}${th("closed", "irr", "IRR p.a.")}${th("closed", "pnl", "P&amp;L")}${th("closed", "days", "Days")}${ed ? "<th></th>" : ""}</tr></thead><tbody>` +
    sortRows(closedRows, ck, cd).map((r, i) => `<tr><td class="rank">${i + 1}</td><td class="tk l"><a href="#/t/${r.ticker}">${r.ticker}</a></td><td class="l">${r.entry_date}</td><td class="l">${r.exit_date}</td><td><span class="pill ${r.t.side === "SHORT" ? "warn" : ""}">${r.t.side}</span> ${fmtN(r.t.qty, 0)}</td><td>${fmtN(r.entry)}</td><td>${fmtN(r.exit)}</td><td class="${cls(r.ret)}">${fmtP(r.ret)}</td><td class="${cls(r.irr)}">${fmtP(r.irr)}${r.days < 30 && r.irr !== null ? "<sup>†</sup>" : ""}</td><td class="${cls(r.pnl)}">${fmtMoney(r.pnl)}</td><td>${r.days}</td>${ed ? `<td class="nowrap"><button class="small ghost" onclick="reopenTrade('${r.t.id}')">Reopen</button> <button class="small ghost" onclick="deleteTrade('${r.t.id}')">✕</button></td>` : ""}</tr>`).join("") + `</tbody></table></div>` : `<div class="empty">Nothing closed yet.</div>`;
  const watchT = watchRows.length ? `<div class="tbl"><table><thead><tr><th class="l">#</th>${th("watch", "ticker", "Ticker", "l")}${th("watch", "added", "Added", "l")}${th("watch", "at", "Price then")}${th("watch", "p", "Price now")}${th("watch", "since", "Since added")}${th("watch", "base", "Intrinsic")}${th("watch", "up", "Upside")}${th("watch", "target", "Target")}${th("watch", "vstarget", "vs target")}${ed ? "<th></th>" : ""}</tr></thead><tbody>` +
    sortRows(watchRows, wk, wd).map((r, i) => `<tr><td class="rank">${i + 1}</td><td class="tk l"><a href="#/t/${r.ticker}">${r.ticker}</a>${r.w.qty ? ` <span class="muted">×${fmtN(r.w.qty, 0)}</span>` : ""}</td><td class="l">${r.added}</td><td>${fmtN(r.at)}</td><td>${priceCell(r.ticker)}</td><td class="${cls(r.since)}">${fmtP(r.since)}</td><td>${r.base !== null ? fmtN(r.base) : '<span class="muted">—</span>'}</td><td class="${cls(r.up)}">${fmtP(r.up)}</td><td>${fmtN(r.target)}</td><td class="${r.vstarget === null ? "muted" : r.vstarget <= 0 ? "pos" : ""}">${r.vstarget === null ? "—" : r.vstarget <= 0 ? "at / below target" : fmtP(r.vstarget) + " above"}</td>${ed ? `<td class="nowrap"><button class="small" onclick="promoteWatch('${r.w.id}')">Enter</button> <button class="small ghost" onclick="removeWatch('${r.w.id}')">✕</button></td>` : ""}</tr>`).join("") + `</tbody></table></div><div class="hint" style="padding:8px 16px">Ranked by upside to the base-case intrinsic value, largest first.</div>` : `<div class="empty">Watchlist is empty. ${ed ? 'Use <b>+ Watch</b> to add a name.' : ''}</div>`;
  return tiles +
    `<div class="card"><div class="hd"><h2>Open positions</h2><span class="sub">ranked best to worst by return to date · click a column to re-rank</span></div>${openT}</div>` +
    `<div class="card"><div class="hd"><h2>Watchlist</h2><span class="sub">names waiting for a price</span></div>${watchT}</div>` +
    `<div class="card"><div class="hd"><h2>Closed trades</h2><span class="sub">realised results</span></div>${closedT}</div>`;
}

function valBar(v, p) {
  const bear = num(v.bear), base = num(v.base), bull = num(v.bull);
  const pts = [bear, base, bull, p].filter(x => x !== null && x > 0);
  if (!pts.length) return "";
  const lo = Math.min(...pts) * 0.85, hi = Math.max(...pts) * 1.1, W = 560, H = 78, L = 10, R = 10, x = val => L + (val - lo) / (hi - lo) * (W - L - R);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;overflow:visible" font-family="IBM Plex Sans, sans-serif" font-size="11">`;
  s += `<line x1="${L}" x2="${W - R}" y1="40" y2="40" stroke="var(--rule)" stroke-width="1"/>`;
  if (bear !== null && bull !== null) s += `<rect x="${x(bear)}" y="31" width="${Math.max(2, x(bull) - x(bear))}" height="18" fill="var(--accent-soft)" rx="3"/>`;
  if (bear !== null) s += `<text x="${x(bear)}" y="64" text-anchor="middle" fill="var(--ink3)">bear ${fmtN(bear)}</text>`;
  if (bull !== null) s += `<text x="${x(bull)}" y="64" text-anchor="middle" fill="var(--ink3)">bull ${fmtN(bull)}</text>`;
  if (base !== null) s += `<circle cx="${x(base)}" cy="40" r="6" fill="var(--accent)"/><text x="${x(base)}" y="22" text-anchor="middle" fill="var(--accent)" font-weight="600">base ${fmtN(base)}</text>`;
  if (p !== null) s += `<line x1="${x(p)}" x2="${x(p)}" y1="24" y2="56" stroke="var(--bad)" stroke-width="2"/><text x="${x(p)}" y="14" text-anchor="middle" fill="var(--bad)" font-weight="600">price ${fmtN(p)}</text>`;
  return s + `</svg>`;
}

function tickerView(tk) {
  const trades = S.data.trades.filter(t => t.ticker === tk), watch = S.data.watchlist.filter(w => w.ticker === tk);
  const v = valuationFor(tk), th = S.data.theses[tk], q = S.prices[tk], p = px(tk);
  const name = q?.name || v?.name || "";
  const ed = !!S.token;
  const openPos = trades.filter(t => !t.exit_date);
  let valCard;
  if (v) {
    valCard = `<div class="card"><div class="hd"><h2>Intrinsic value</h2><span class="sub">as of ${esc(v.asof || "?")}</span></div><div class="bd">
      <div class="row" style="align-items:baseline;gap:28px"><div><div class="hint">base value / share</div><div class="big">${fmtN(v.base)}</div></div>
      <div><div class="hint">upside to base</div><div class="big ${p && v.base ? cls(v.base / p - 1) : "muted"}">${p && v.base ? fmtP(v.base / p - 1) : "—"}</div></div>
      <div><div class="hint">bear / base / bull</div><div class="big" style="font-size:22px">${fmtN(v.bear)} / ${fmtN(v.base)} / ${fmtN(v.bull)}</div></div></div>
      <div class="valbar">${valBar(v, p)}</div>
      ${v.note ? `<div class="hint" style="margin-top:6px">${esc(v.note)}</div>` : ""}
      ${ed ? `<div class="row" style="margin-top:12px"><button class="small" onclick="setValuationForm('${tk}')">Edit values</button></div>` : ""}
    </div></div>`;
  } else {
    valCard = `<div class="card"><div class="hd"><h2>Intrinsic value</h2></div><div class="bd"><div class="empty" style="padding:12px">No valuation on file for ${esc(tk)}. Run the owner-earnings pipeline (<code>do ${esc(tk)}</code>) and sync, ${ed ? `or <a href="#" onclick="setValuationForm('${tk}');return false">enter one by hand</a>.` : "or unlock editing to enter one by hand."}</div></div></div>`;
  }
  const rows = trades.map(t => ({ t, m: tradeMetrics(t) })).sort((a, b) => (b.t.entry_date > a.t.entry_date ? 1 : -1));
  const tradeCard = `<div class="card"><div class="hd"><h2>Trades in ${esc(tk)}</h2><span class="sub">${openPos.length} open · ${trades.length - openPos.length} closed</span></div>${rows.length ? `<div class="tbl"><table><thead><tr><th class="l">Entered</th><th class="l">Exited</th><th>Side · qty</th><th>Entry</th><th>Exit / now</th><th>Return</th><th>IRR p.a.</th><th>P&amp;L</th><th>Days</th>${ed ? "<th></th>" : ""}</tr></thead><tbody>` +
    rows.map(({ t, m }) => `<tr><td class="l">${t.entry_date}</td><td class="l">${t.exit_date || '<span class="pill good">open</span>'}</td><td><span class="pill ${t.side === "SHORT" ? "warn" : ""}">${t.side}</span> ${fmtN(t.qty, 0)}</td><td>${fmtN(t.entry_price)}</td><td>${m.open ? priceCell(tk) : fmtN(t.exit_price)}</td><td class="${cls(m.ret)}">${fmtP(m.ret)}</td><td class="${cls(m.irr)}">${fmtP(m.irr)}${m.days < 30 && m.irr !== null ? "<sup>†</sup>" : ""}</td><td class="${cls(m.pnl)}">${fmtMoney(m.pnl)}</td><td>${m.days}</td>${ed ? `<td class="nowrap">${m.open ? `<button class="small" onclick="exitTradeForm('${t.id}')">Exit</button>` : `<button class="small ghost" onclick="reopenTrade('${t.id}')">Reopen</button>`} <button class="small ghost" onclick="deleteTrade('${t.id}')">✕</button></td>` : ""}</tr>${t.notes || t.exit_notes ? `<tr><td colspan="${ed ? 10 : 9}" class="l hint" style="white-space:normal">${t.notes ? "Entry: " + esc(t.notes) : ""}${t.notes && t.exit_notes ? " · " : ""}${t.exit_notes ? "Exit: " + esc(t.exit_notes) : ""}</td></tr>` : ""}`).join("") + `</tbody></table></div>` : `<div class="empty">No trades in ${esc(tk)} yet.</div>`}
    ${watch.length ? `<div class="bd hint" style="border-top:1px solid var(--rule)">On the watchlist since ${esc(watch[0].added)}${watch[0].target_price ? ` · target ${fmtN(watch[0].target_price)}` : ""}${watch[0].notes ? ` · ${esc(watch[0].notes)}` : ""}</div>` : ""}
    ${ed ? `<div class="bd row" style="border-top:1px solid var(--rule)"><button class="small" onclick="addTradeFormFor('${tk}')">+ Trade in ${esc(tk)}</button>${watch.length ? "" : `<button class="small ghost" onclick="addWatchForm('${tk}')">+ Watch</button>`}</div>` : ""}</div>`;
  const draft = S.drafts[tk] ?? (() => { try { return localStorage.getItem("pb_draft_" + tk); } catch (e) { return null; } })();
  const thesisCard = `<div class="card"><div class="hd"><h2>Thesis</h2><span class="sub">${th?.updated ? "updated " + esc(th.updated.slice(0, 10)) : "not written yet"}</span></div><div class="bd">
    ${ed ? `<textarea id="thesis-ta" placeholder="Why this business, why this price, what would prove you wrong, what you expect to see and by when.">${esc(draft ?? th?.text ?? "")}</textarea>
      <div class="row" style="margin-top:10px;justify-content:space-between"><span class="hint" id="draft-hint">${draft !== null && draft !== (th?.text ?? "") ? "unsaved draft restored from this browser" : ""}</span><div class="row"><button class="ghost small" onclick="discardDraft('${tk}')">Discard draft</button><button class="primary" onclick="saveThesis('${tk}')">Save thesis</button></div></div>`
      : `<div class="thesis">${esc(th?.text ?? "")}</div>`}
  </div></div>`;
  const quoteLine = q && q.price !== null ? `<div class="row" style="align-items:baseline;gap:14px"><span class="big">${fmtN(q.price)}</span><span class="hint">${q.ccy || ""} ${q.src === "live" ? "live" : "snapshot"} · ${esc((q.asof || "").slice(0, 16).replace("T", " "))}${q.prev ? " · prev close " + fmtN(q.prev) + " (" + fmtP(q.price / q.prev - 1) + ")" : ""}${q.ext && q.mkt !== "REG_MKT" ? " · after hours " + fmtN(q.ext) : ""}</span></div>` : `<div class="hint">no quote yet — press refresh</div>`;
  return `<div class="crumb"><a href="#/">← Book</a></div><div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:16px"><div><h1 style="font-size:30px">${esc(tk)} <span style="font-weight:400;color:var(--ink3);font-size:18px">${esc(name)}</span></h1>${quoteLine}</div></div>
    <div class="detail-grid"><div>${valCard}${tradeCard}</div><div>${thesisCard}</div></div>`;
}
function addTradeFormFor(tk) { addTradeForm(); setTimeout(() => { const i = $("#modal [name=ticker]"); if (i) i.value = tk; }, 0); }
function discardDraft(tk) { delete S.drafts[tk]; try { localStorage.removeItem("pb_draft_" + tk); } catch (e) { } render(); }

function setupView() {
  return `<div class="crumb"><a href="#/">← Book</a></div><div class="card" style="max-width:640px"><div class="hd"><h2>One-time setup: store the editing token</h2></div><div class="bd">
    <p>Editing commits to <code>${RI ? esc(RI.owner + "/" + RI.repo) : "(repository not detected)"}</code>. Create a <b>fine-grained personal access token</b> at github.com → Settings → Developer settings, restricted to this one repository with <b>Contents: read and write</b> only. It is encrypted with the PIN below and committed as <code>data/vault.json</code>.</p>
    <p class="hint">Anyone who reads the repository can attempt to brute-force the PIN offline, so keep the token scoped to this repository alone; the worst case is a vandalised paper book, and every version stays in git history.</p>
    <form id="f"><label class="f">GitHub token<input name="token" type="password" required autocomplete="off"></label>
    <label class="f" style="margin-top:8px">Editing PIN<input name="pin" type="password" required autocomplete="off"></label>
    <label class="f" style="margin-top:8px">Repeat PIN<input name="pin2" type="password" required autocomplete="off"></label>
    <div id="seterr" class="hint" style="min-height:18px;margin-top:6px"></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="primary" type="submit">Encrypt and commit</button></div></form></div></div>`;
}
async function doSetup(form) {
  const err = $("#seterr"); const fd = Object.fromEntries(new FormData(form).entries());
  if (fd.pin !== fd.pin2) { err.innerHTML = '<span class="danger">PINs differ.</span>'; return; }
  if (!RI) { err.innerHTML = '<span class="danger">Repository not detected. Set CONFIG in index.html.</span>'; return; }
  err.textContent = "checking token…"; const bad = await verifyToken(fd.token.trim()); if (bad) { err.innerHTML = '<span class="danger">' + esc(bad) + '</span>'; return; }
  err.textContent = "encrypting…"; const vault = await encryptToken(fd.pin, fd.token.trim());
  const cur = await fetch(apiBase() + "data/vault.json?ref=" + RI.branch, { headers: { Authorization: "Bearer " + fd.token.trim(), Accept: "application/vnd.github+json" }, cache: "no-store" });
  const body = { message: "Set editing vault [via Paper Book]", content: b64enc(JSON.stringify(vault, null, 2) + "\n"), branch: RI.branch };
  if (cur.ok) body.sha = (await cur.json()).sha;
  const r = await fetch(apiBase() + "data/vault.json", { method: "PUT", headers: { Authorization: "Bearer " + fd.token.trim(), Accept: "application/vnd.github+json", "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { err.innerHTML = '<span class="danger">Commit failed: ' + r.status + '</span>'; return; }
  S.vault = vault; S.token = fd.token.trim(); sessionStorage.setItem("pb_token", S.token); toast("Vault stored — editing unlocked"); location.hash = "#/"; await loadBook(); render();
}
function footer() { return `<div class="foot">Database of record: <code>data/portfolio.json</code>${RI ? ` in <a href="https://github.com/${esc(RI.owner)}/${esc(RI.repo)}" target="_blank" rel="noopener">${esc(RI.owner)}/${esc(RI.repo)}</a>` : ""}. Quotes from CNBC's public quote service (regular-session last); <sup style="color:var(--warn)">s</sup> marks a fallback snapshot from the scheduled workflow. Paper trades only — nothing here is an order.</div>`; }

function wireAfterRender() {
  const b = $("#refresh"); if (b) b.onclick = () => refreshPrices();
  const t = $("#theme"); if (t) t.onclick = () => { const cur = document.documentElement.getAttribute("data-theme"); const nxt = cur === "dark" ? "light" : cur === "light" ? "" : (matchMedia("(prefers-color-scheme:dark)").matches ? "light" : "dark"); if (nxt) document.documentElement.setAttribute("data-theme", nxt); else document.documentElement.removeAttribute("data-theme"); try { localStorage.setItem("pb_theme", nxt); } catch (e) { } };
  document.querySelectorAll("th[data-sort]").forEach(h => h.onclick = () => { const [tbl, key] = h.dataset.sort.split(":"); const [k, d] = S.sort[tbl]; S.sort[tbl] = [key, k === key ? -d : (key === "ticker" || key === "entry_date" || key === "added" ? 1 : -1)]; render(); });
  const ta = $("#thesis-ta"); if (ta) ta.addEventListener("input", () => { const tk = S.route.tk; S.drafts[tk] = ta.value; try { localStorage.setItem("pb_draft_" + tk, ta.value); } catch (e) { } const h = $("#draft-hint"); if (h) h.textContent = "draft kept in this browser until saved"; });
  const sf = $("#f"); if (sf && S.route.view === "setup") sf.addEventListener("submit", e => { e.preventDefault(); doSetup(sf); });
  renderStatus();
}

/* ---------- boot ---------- */
(async function () {
  try { const th = localStorage.getItem("pb_theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) { }
  try { S.token = sessionStorage.getItem("pb_token") || null; } catch (e) { }
  if (LOCAL) S.token = "local";
  await Promise.all([loadVault(), loadSnapshot()]);
  await loadBook();
  render();
  window.addEventListener("hashchange", render);
  refreshPrices();
})();
</script>
</body>
</html>
