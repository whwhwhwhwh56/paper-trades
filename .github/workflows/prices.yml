name: Refresh price snapshot

on:
  workflow_dispatch:
  schedule:
    # Every 20 minutes during US regular hours (13:30–20:00 UTC, Mon–Fri) plus one
    # post-close run. GitHub cron is UTC and may lag a few minutes.
    - cron: "*/20 13-20 * * 1-5"
    - cron: "15 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quotes
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python refresh_prices.py
      - name: Commit snapshot
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          if git diff --quiet -- data/prices.json; then echo "no change"; exit 0; fi
          git add data/prices.json
          git commit -m "prices: snapshot $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git pull --rebase --autostash
          git push
